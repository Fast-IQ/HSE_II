<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мировое Время</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00d9ff;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-top: 30px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .map-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .world-map {
            width: 100%;
            height: 500px;
            position: relative;
            cursor: pointer;
        }

        .world-map svg {
            width: 100%;
            height: 100%;
        }

        .timezone-region {
            fill: rgba(0, 217, 255, 0.1);
            stroke: rgba(0, 217, 255, 0.3);
            stroke-width: 0.5;
            transition: all 0.3s ease;
        }

        .timezone-region:hover {
            fill: rgba(0, 217, 255, 0.3);
            stroke: #00d9ff;
            stroke-width: 1;
        }

        .timezone-region.active {
            fill: rgba(0, 217, 255, 0.4);
            stroke: #00d9ff;
            stroke-width: 1.5;
        }

        .info-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .city-name {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #00d9ff;
        }

        .timezone-name {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        .clock {
            font-size: 4rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #fff;
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
            margin-bottom: 20px;
        }

        .date {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        .offset-info {
            background: rgba(0, 217, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .offset-label {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 5px;
        }

        .offset-value {
            font-size: 1.3rem;
            color: #00d9ff;
        }

        .instructions {
            text-align: center;
            padding: 20px;
            color: #a0a0a0;
            margin-top: 30px;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>

                <div class="clock" id="clock">--:--:--</div>
                <div class="date" id="date">--.--.----</div>
                <div class="offset-info">
                    <div class="offset-label">Смещение от UTC</div>
                    <div class="offset-value" id="offset">--</div>
                </div>
            </div>
        </div>

        <div class="instructions">
            <p>💡 Кликните на любой регион карты, чтобы увидеть время в этом часовом поясе</p>

    </div>

        let selectedCity = null;
        let clockInterval = null;

        // Упрощенная карта мира (континенты)
        const worldMapSVG = `

                <path class="timezone-region" data-timezone="America/Lima" d="M140,220 L180,210 L190,260 L160,270 Z"/>

                <!-- Европа -->

                <path class="timezone-region" data-timezone="Europe/Madrid" d="M410,115 L440,110 L445,140 L415,145 Z"/>

        function init() {
            document.getElementById('worldMap').innerHTML = worldMapSVG;
            
            // Добавляем обработчики кликов на регионы
            document.querySelectorAll('.timezone-region').forEach(region => {
                region.addEventListener('click', function() {
                    const timezone = this.getAttribute('data-timezone');
                    selectTimezone(timezone);
                    
                    // Обновляем активный класс
                    document.querySelectorAll('.timezone-region').forEach(r => r.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Выбираем первый город по умолчанию
            selectCity(cities[0]);
        }

        function selectTimezone(timezone) {
            const city = cities.find(c => c.timezone === timezone);
            if (city) {
                selectCity(city);
            }
        }

        function selectCity(city) {
            selectedCity = city;
            document.getElementById('cityName').textContent = city.name;
            document.getElementById('timezoneName').textContent = city.timezone;
            updateClock();
            
            if (clockInterval) {
                clearInterval(clockInterval);
            }
            clockInterval = setInterval(updateClock, 1000);
        }

        function updateClock() {
            if (!selectedCity) return;

            const now = new Date();
            const options = {
                timeZone: selectedCity.timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            
            const dateOptions = {
                timeZone: selectedCity.timezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            };

            const timeString = new Intl.DateTimeFormat('ru-RU', options).format(now);
            const dateString = new Intl.DateTimeFormat('ru-RU', dateOptions).format(now);
            
            // Получаем смещение
            const tzString = now.toLocaleString('en-US', { timeZone: selectedCity.timezone });
            const utcString = now.toLocaleString('en-US', { timeZone: 'UTC' });
            
            const tzDate = new Date(tzString);
            const utcDate = new Date(utcString);
            
            let offsetMs = tzDate.getTime() - utcDate.getTime();
            let offsetHours = offsetMs / (1000 * 60 * 60);
            
            const offsetSign = offsetHours >= 0 ? '+' : '';
            const offsetFormatted = `UTC${offsetSign}${offsetHours}`;

            document.getElementById('clock').textContent = timeString;
            document.getElementById('date').textContent = dateString;
            document.getElementById('offset').textContent = offsetFormatted;
        }

        // Инициализация при загрузке
        init();
    </script>
